name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: کد را دریافت کن
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: نصب پکیج‌های برنامه‌ی وب
        run: npm install

      - name: ساخت برنامه‌ی وب
        run: npm run build

      - name: قرار دادن برنامه‌ی وب داخل APK
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets
          cp -r dist android/app/src/main/assets/web

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: ساخت APK دیباگ
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: hami-tools-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
